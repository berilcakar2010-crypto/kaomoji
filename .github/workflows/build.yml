name: APK Derle

# Her push'ta çalışır, ayrıca Actions sekmesinden elle de başlatılabilir.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Debug + Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Release APK derle (imzasız)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Debug APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: kaomoji-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: kaomoji-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  release:
    name: Etiketliyse Release oluştur
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle assembleDebug --no-daemon

      - name: Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
